[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-trilock"
version = "0.2.0"
description = "A drop-in MCP proxy that makes the lethal trifecta structurally impossible."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Trilock contributors" }]
keywords = ["mcp", "security", "prompt-injection", "agent", "taint-tracking"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
]
dependencies = [
  "mcp>=2.1.1",
  "pydantic>=2.9",
  "pyyaml>=6.0.2",
  "typer>=0.15",
  "starlette>=0.41",
  "anyio>=4.6",
  "python-ulid>=3.0",
]

[project.optional-dependencies]
detect = ["onnxruntime>=1.20,<1.24", "tokenizers>=0.21", "huggingface-hub>=0.27"]
bench = ["agentdojo>=0.1.20", "matplotlib>=3.9", "numpy>=2.0"]
# torch 2.2.2 is the last release with a macOS x86_64 wheel; newer only ship arm64.
perplexity = ["torch>=2.2,<2.3", "transformers>=4.44,<4.50", "matplotlib>=3.9"]

[project.scripts]
trilock = "trilock.cli:main"

[project.urls]
Homepage = "https://github.com/trilock/mcp-trilock"
Source = "https://github.com/trilock/mcp-trilock"

[dependency-groups]
# `uv run` syncs the default groups on every invocation and removes anything
# else, so the detector runtime and the benchmark harness live here as well as
# in the extras above: a plain `uv run pytest` must not silently uninstall
# onnxruntime and skip the model-backed tests.
detect = ["onnxruntime>=1.20,<1.24", "tokenizers>=0.21", "huggingface-hub>=0.27"]
bench = ["agentdojo>=0.1.20", "matplotlib>=3.9", "numpy>=2.0"]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=6.0",
  "hypothesis>=6.112",
  "mypy>=1.13",
  "ruff>=0.8",
  "types-pyyaml>=6.0.12",
]

[tool.uv]
default-groups = ["dev", "detect", "bench"]

[tool.hatch.build.targets.wheel]
packages = ["src/trilock"]

[tool.hatch.build.targets.wheel.force-include]
"policies" = "trilock/_policies"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "bench"]

[tool.ruff.lint]
select = [
  "E", "F", "W",      # pycodestyle, pyflakes
  "I",                # isort
  "N",                # pep8-naming
  "UP",               # pyupgrade
  "B",                # bugbear
  "C4",               # comprehensions
  "SIM",              # simplify
  "RUF",              # ruff-specific
  "ASYNC",            # async correctness
  "S",                # bandit
  "TID",              # tidy imports
  "PTH",              # pathlib
]
ignore = [
  "S101",   # assert: used deliberately in tests and invariants
  "S603",   # subprocess call: we spawn stdio MCP servers by design
  "S607",   # partial executable path: config-supplied commands
]

[tool.ruff.lint.per-file-ignores]
# ASYNC110: tests legitimately poll for a state change another task owns.
# ASYNC240: test setup does trivial blocking path work; no event loop to starve.
"tests/**" = ["S", "B011", "ASYNC110", "ASYNC240"]
# E501: the report generator holds long prose strings that render into RESULTS.md.
"bench/**" = ["S", "E501"]
# The invisible-text corpus builder must contain the real control characters it
# encodes; RUF001-003 exist to flag exactly those, which is the point here.
"tests/fixtures/attacks/**" = ["RUF001", "RUF002", "RUF003"]
# These suites assert on confusable characters, which is what RUF001-003 flag.
"tests/unit/test_normalize.py" = ["RUF001", "RUF002", "RUF003"]
"tests/unit/test_scope.py" = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["trilock"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
disallow_any_explicit = false
show_error_codes = true
files = ["src/trilock"]

[[tool.mypy.overrides]]
module = ["onnxruntime.*", "tokenizers.*", "agentdojo.*", "transformers.*", "torch.*", "matplotlib.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning:trilock.*"]
markers = [
  "slow: long-running tests (soak, benchmark)",
  "needs_model: requires a downloaded ONNX detector model",
  "needs_network: requires network access",
]

[tool.coverage.run]
source = ["src/trilock"]
branch = true
